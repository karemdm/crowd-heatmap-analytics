[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crowd-heatmap-analytics"
version = "0.1.0"
description = "Person tracking with YOLO + ByteTrack and a decaying spatial occupancy heatmap rendered side by side."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "AGPL-3.0-only" }
authors = [{ name = "Karem Daiane Marcomini" }]
dependencies = [
    "ultralytics>=8.4.0",
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
    "lap>=0.5.12",
]

[project.scripts]
crowd-heatmap = "crowd_heatmap.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
